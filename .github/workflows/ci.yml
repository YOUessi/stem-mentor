name: Simulation test suite
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: cd backend && PYTHONPATH=. pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/web/app.js
      - run: node --check apps/web/study_tools.js
      - run: |
          node --check apps/web/lab/plot2d.js
          node --check apps/web/lab/triangle.js
          node --check apps/web/lab/scene3d.js
          node --check apps/web/lab/controller.js
          node --check apps/web/lab/exploration_math.js
          node --check apps/web/lab/explorers2d.js
          node --check apps/web/lab/sections3d.js
      - run: node --test tests/node/*.test.cjs
      - run: cd backend && PYTHONPATH=. python evaluate_policy.py

      - run: cd backend && PYTHONPATH=. python evaluate_v05.py
      - run: |
          node --check apps/web/lab/foundations_math.js
          node --check apps/web/lab/interval_math.js
          node --check apps/web/lab/foundations2d.js
          node --check apps/web/lab/numberline.js
          node --check apps/web/lab/sequences_math.js
          node --check apps/web/lab/sequence_policy.js
          node --check apps/web/lab/sequences2d.js
          node --check apps/web/lab/extrema_math.js
          node --check apps/web/lab/extrema2d.js
          node --check apps/web/lab/probability_math.js
          node --check apps/web/lab/probability2d.js
